name: CI

# Every gate that blocks a merge runs here. A red build is authoritative:
# fix the cause, never the threshold.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"
  NODE_VERSION: "24"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release checksums file.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

# Third-party actions are pinned to a commit SHA, not a tag — a tag can be
# moved to point at different code after review.
jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    # Pinned to the exact patch release (18.6) the local dev Postgres
    # install uses, so migrations behave identically in both places. trust
    # auth means no password-shaped string ever needs to live in this file.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: hotel_sales_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/hotel_sales_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: ruff - lint
        run: uv run ruff check .

      - name: ruff - format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

      # Both of these are generated-and-committed artifacts (see each
      # script's module docstring) — regenerating here and diffing catches
      # the case where lib/hijri.py or services/pricing/seasons.py changed
      # but the committed output wasn't refreshed to match, which would
      # otherwise let admin/'s calendar preview silently drift from the
      # real pricing engine.
      - name: Hijri calendar reference table is up to date
        run: |
          uv run python -m tests.generate_hijri_calendar_reference
          git diff --exit-code admin/lib/hijriCalendarReference.json

      - name: Season conformance fixtures are up to date
        run: |
          uv run python -m tests.generate_season_conformance_fixtures
          git diff --exit-code tests/season_conformance_fixtures.json

      # Regenerates only the expectedValid half of each fixture case (the
      # part Postgres itself computes) — expectedDefect is hand-authored
      # and never touched by this script, so this diff catches only a
      # drift between db/migrations/0006_price_rules.sql's validators and
      # the committed accept/reject ground truth, not a change to anyone's
      # manual classification.
      - name: Price rule band conformance fixtures are up to date
        run: |
          uv run python -m tests.generate_price_rules_band_conformance_fixtures
          git diff --exit-code tests/price_rules_band_conformance_fixtures.json

      # Two thresholds, enforced separately. coverage.py has no per-path
      # option, so the same data file is reported twice.
      - name: coverage - pricing and inventory at 100%
        run: >-
          uv run coverage report
          --include="services/pricing/*,services/inventory/*"
          --fail-under=100

      - name: coverage - everything else at 80%
        run: >-
          uv run coverage report
          --omit="services/pricing/*,services/inventory/*"
          --fail-under=80

  frontend:
    name: admin lint, types
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # next-env.d.ts and .next/types/ are both gitignored — generated
      # fresh here, the same way a local `next dev`/`next build` would,
      # rather than committing generated output. tsc fails without this:
      # next-env.d.ts imports directly from .next/types/routes.d.ts.
      - name: next typegen
        run: npx next typegen

      - name: eslint
        run: npx eslint .

      - name: tsc --noEmit
        run: npx tsc --noEmit

      # Verifies seasonCalendar.ts against tests/season_conformance_fixtures.json
      # (committed, generated from the real services/pricing/seasons.py —
      # see the python job's "Season conformance fixtures are up to date"
      # step for the other half of this guarantee). A change to either
      # side without the other fails one of these two jobs.
      # Runs every Vitest suite in admin/ — seasonCalendar conformance
      # (against tests/season_conformance_fixtures.json) and
      # priceRuleBands conformance (against
      # tests/price_rules_band_conformance_fixtures.json) alike. The
      # python job's two "... fixtures are up to date" steps are the other
      # half of each guarantee; a change to either side without the other
      # fails one of these two jobs.
      - name: vitest
        run: npx vitest run

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan repository history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: pip-audit
        run: uv run pip-audit

  migrations:
    name: migrations lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: sqlfluff
        run: uv run sqlfluff lint db/migrations
