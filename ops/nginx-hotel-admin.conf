# خادم العرض 149.104.71.71 — لا ufw على الجهاز، فهذا الملف + ربط
# hotel-admin.service على 127.0.0.1:3000 هما الحماية الوحيدة.
#
# منفذ 80 يجب أن يبقى حراً دائماً لمسار .well-known/acme-challenge —
# التجديد التلقائي لشهادة Let's Encrypt يفشل بصمت إن احتجزه أي شيء آخر
# لاحقاً (قاعدة جدار، خدمة ثانية، إلخ). انظر docs/deployment.md.

server {
    listen 80;
    listen [::]:80;
    server_name 149.104.71.71;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 149.104.71.71;

    ssl_certificate /etc/letsencrypt/live/149.104.71.71/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/149.104.71.71/privkey.pem;

    location /login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
